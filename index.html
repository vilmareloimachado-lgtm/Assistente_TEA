<style>
:root{--bg:#e9eaee;--soft:#f5f8f7;--ink:#292d30;--pink:#f774b2;--pk:#fbe0ee;--mut:#6a7076;--ln:#e6e8ec;--sh:0 8px 22px rgba(30,30,60,.08),0 1px 3px rgba(30,30,60,.05)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:100vh;background:#fff;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}header h1{font-size:16px;font-weight:600;margin:0}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0;flex:none}
main{flex:1;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--soft);border-radius:20px;padding:12px 14px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}.mut{color:var(--mut);font-size:12px}.big{font-size:20px}
.btn{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--ln);background:#fff;color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pk{background:var(--pink);border-color:var(--pink);color:#fff}.btn.dk{background:var(--ink);border-color:var(--ink);color:#fff}.btn.ol{border-color:var(--pink);color:#c2468a}.btn.rd{color:#c2334d;border-color:#f0c4cc}.btn.sm{height:28px;font-size:12px;padding:0 11px}
.chip{font-size:11px;padding:1px 9px;border-radius:12px;background:#fff;border:1px solid var(--ln);color:var(--mut)}.chip.pk{background:var(--pk);border-color:var(--pk);color:#b0356f}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
input,select{width:100%;height:38px;border:0;border-radius:14px;background:#eef0f2;padding:0 12px;font:inherit;color:var(--ink)}
label{font-size:12px;color:var(--mut);display:block;margin:8px 2px 4px}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.av{width:38px;height:38px;border-radius:50%;background:var(--pk);color:#b0356f;display:grid;place-items:center;font-weight:700;flex:none}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid #cfd3d8;background:#fff;cursor:pointer;flex:none;padding:0;display:grid;place-items:center;color:#fff}.ck[aria-checked=true]{background:var(--pink);border-color:var(--pink)}
.rs{text-decoration:line-through;color:var(--mut)}.bar{height:6px;background:#e4e6ea;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pink)}
nav{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 14px 14px;background:#fff}
nav button{height:40px;width:40px;border-radius:20px;border:0;background:var(--soft);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mut);font:600 13px system-ui;cursor:pointer;padding:0}nav span{display:none}
nav .on{flex:1;width:auto;background:var(--pink);color:#fff}nav .on span{display:inline}
.ov{position:fixed;inset:0;background:rgba(20,20,40,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:8px}.sheet .btn{justify-content:flex-start;height:38px}
#aviso{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:16px;font-size:13px;display:none;z-index:10;max-width:90%}#aviso.on{display:block}
.msg{padding:8px 12px;border-radius:16px;max-width:85%;white-space:pre-wrap}.me{align-self:flex-end;background:var(--pink);color:#fff}.ia{align-self:flex-start;background:var(--soft);box-shadow:var(--sh)}

const entrada=d=>{Object.assign(S,{token:d.token,tipo:d.tipo_usuario,nome:d.nome,pid:d.tipo_usuario==="usuario_tea"?d.usuario_id:null});guardar()};
const A={
go:d=>go(d.v),filtro:d=>{S.filtro=d.id;render()},
login:()=>run(async()=>{const d=await api("/auth/login",{m:"POST",b:{email:v("e"),senha:v("s")}});S.email=v("e");entrada(d);go(S.tipo==="cuidador"?"perfis":"tarefas")}),
criarconta:()=>run(async()=>{await api("/usuarios/conta",{m:"POST",b:{nome:v("nm"),email:v("e"),senha:v("s"),data_nascimento:br(v("nc"))}});S.email=v("e");S.view="login";render();aviso("Conta criada! Agora é só entrar.")}),
menu:async()=>{const m=mgr(),k=await pick("Menu",m?[["Meus perfis","perfis"],["Excluir minha conta","conta",1],["Sair","sair"]]:[["Voltar ao modo cuidador","volta"],["Sair do aplicativo","sair"]]);if(k==="perfis")go("perfis");if(k==="sair")sair();if(k==="volta")A.volta();if(k==="conta")run(async()=>{const s=await ask({t:"Excluir sua conta?",p:"Digite sua senha. Isso não pode ser desfeito.",ph:"Senha",ok:"Excluir",danger:1,inp:1});if(!s)return;await api("/usuarios/conta",{m:"DELETE",b:{senha:s}});sair("Conta excluída.")})},
volta:()=>run(async()=>{const s=await ask({t:"Voltar ao modo cuidador",p:"Digite a senha do cuidador.",ph:"Senha",inp:1});if(!s)return;entrada(await api("/auth/login",{m:"POST",b:{email:S.email,senha:s}}));S.chat=[];go("perfis")}),
abrir:d=>{S.pid=+d.id;S.chat=[];go("tarefas")},
entrar:d=>run(async()=>{const p=S.perfis.find(x=>x.usuario_id==d.id);let pin=null;if(p.tem_pin){pin=await ask({t:"PIN de "+p.nome,ph:"PIN",ok:"Entrar",inp:1});if(!pin)return}entrada(await api("/auth/entrar-perfil",{m:"POST",b:{usuario_id:+d.id,pin}}));S.pid=+d.id;S.chat=[];guardar();go("tarefas")}),
pm:async d=>{S.pid=+d.id;const p=P(),k=await pick(p.nome,[["Editar perfil","ed"],[p.tem_pin?"Trocar PIN":"Definir PIN","pin"],...(p.tem_pin?[["Remover PIN","rpin"]]:[]),["Cuidadores","cu"],...(p.principal?[["Excluir perfil","del",1]]:[])]);if(k==="ed")go("pform",p);if(k==="cu")go("cuid");if(k==="pin")run(async()=>{const n=await ask({t:"PIN de "+p.nome,ph:"Novo PIN",inp:1});if(!n)return;await api(`/usuarios/${p.usuario_id}/pin`,{m:"PUT",b:{pin:n}});go("perfis");aviso("PIN salvo.")});if(k==="rpin")run(async()=>{await api(`/usuarios/${p.usuario_id}/pin`,{m:"DELETE"});go("perfis");aviso("PIN removido.")});if(k==="del")run(async()=>{if(!await ask({t:"Excluir o perfil de "+p.nome+"?",p:"Apaga também as tarefas e passos. Não dá para desfazer.",ok:"Excluir",danger:1}))return;await api("/usuarios/"+p.usuario_id,{m:"DELETE"});go("perfis");aviso("Perfil excluído.")})},
salvarperfil:()=>run(async()=>{const e=S.edit,b={nome:v("nm"),estilo_instrucao:v("es"),nivel_suporte:v("nv"),data_nascimento:br(v("nc"))};if(e)await api("/usuarios/"+e.usuario_id,{m:"PUT",b});else await api("/usuarios",{m:"POST",b:{...b,pin:v("pn")||null}});await go("perfis");aviso("Perfil salvo.")}),
addcuid:()=>run(async()=>{const em=v("ce");if(!em)return aviso("Digite o email.");if(!await ask({t:"Dar acesso?",p:`${em} vai ver os dados de ${P().nome}.`,ok:"Adicionar"}))return;await api(`/usuarios/${S.pid}/cuidadores`,{m:"POST",b:{email:em}});await go("cuid");aviso("Cuidador adicionado.")}),
remcuid:d=>run(async()=>{if(!await ask({t:"Remover este cuidador?",ok:"Remover",danger:1}))return;await api(`/usuarios/${S.pid}/cuidadores/${d.id}`,{m:"DELETE"});go("cuid")}),
tornar:d=>run(async()=>{if(!await ask({t:"Passar o papel de principal?",p:"Você passa a ser cuidador comum neste perfil.",ok:"Passar"}))return;await api(`/usuarios/${S.pid}/cuidador-principal`,{m:"PUT",b:{novo_principal_id:+d.id}});S.perfis=(await api("/usuarios")).usuarios;go("cuid")}),
abrirt:d=>{S.ab.has(d.id)?S.ab.delete(d.id):S.ab.add(d.id);render()},
tt:d=>run(async()=>{await api(`/tarefas/${d.id}/status`,{m:"PATCH"});go("tarefas")}),
tp:d=>run(async()=>{await api(`/passos/${d.id}/status`,{m:"PATCH"});go("tarefas")}),
delp:d=>run(async()=>{if(!await ask({t:"Excluir este passo?",ok:"Excluir",danger:1}))return;await api("/passos/"+d.id,{m:"DELETE"});go("tarefas")}),
delt:d=>run(async()=>{if(!await ask({t:"Excluir esta tarefa?",ok:"Excluir",danger:1}))return;await api("/tarefas/"+d.id,{m:"DELETE"});go("tarefas")}),
edt:d=>go("tform",tarefa(d.id)),
salvartarefa:()=>run(async()=>{const e=S.edit;if(e)await api("/tarefas/"+e.tarefa_id,{m:"PUT",b:{titulo:v("ti"),descricao:v("de"),prioridade:v("pr"),prazo:br(v("pz"))}});else await api("/tarefas/"+S.pid,{m:"POST",b:{titulo:v("ti"),descricao:v("de"),tipo:v("tp"),prioridade:v("pr"),prazo:br(v("pz"))}});await go("tarefas");aviso("Tarefa salva.")}),
sugerir:d=>run(async()=>{aviso("Pensando…");S.sug[d.id]=(await api(`/ia/tarefas/${d.id}/sugerir-passos`,{m:"POST"})).passos;render()}),
usar:d=>run(async()=>{await api(`/tarefas/${d.id}/passos`,{m:"POST",b:{textos:S.sug[d.id]}});delete S.sug[d.id];go("tarefas")}),
enviar:()=>run(async()=>{const q=v("q");if(!q)return;S.chat.push({r:"me",t:q});render();const r=(await api(`/ia/${S.pid}/chat`,{m:"POST",b:{pergunta:q}})).respostas;S.chat.push({r:"ia",t:Array.isArray(r)?r.join("\n"):r});render();$("#q")?.focus()})
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)A[b.dataset.a]?.(b.dataset)});
// Enter: em formulários com vários campos só passa para o próximo campo (nunca grava); no login/chat envia
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.target.closest(".ov"))return;const n=e.target.closest("[data-nx]");if(n){e.preventDefault();const f=[...n.querySelectorAll("input,select")],i=f.indexOf(e.target);if(f[i+1])f[i+1].focus();return}const g=e.target.closest("[data-go]")||(e.target.id==="q"?document:null);if(g){e.preventDefault();(g===document?$("#bc"):g.querySelector(g.dataset.go))?.click()}});
if(S.token)go(S.tipo==="cuidador"?"perfis":"tarefas");else render();
</script></body></html>
